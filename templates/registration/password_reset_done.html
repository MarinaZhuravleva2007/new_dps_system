{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm text-center" style="border-radius: 16px; overflow: hidden;">
                
                <div class="py-4" style="background-color: var(--navy-900); border-bottom: 3px solid var(--accent);">
                    <h5 class="text-white mb-0" style="font-family: var(--font-heading); font-weight: 700;">Восстановление доступа</h5>
                </div>

                <div class="card-body p-4 p-lg-5" style="background-color: #ffffff;">
                    <div class="mb-4">
                        <div class="rounded-circle d-inline-flex align-items-center justify-content-center" 
                             style="width: 80px; height: 80px; background-color: var(--gray-50); border: 2px solid rgba(184, 137, 43, 0.3);">
                            <i class="fas fa-check fa-3x" style="color: var(--accent);"></i>
                        </div>
                    </div>

                    <h4 class="mb-3 fw-bold" style="color: var(--navy-900); font-family: var(--font-heading);">Проверьте вашу почту</h4>

                    <p class="text-muted mb-4" style="line-height: 1.6; font-size: 0.95rem;">
                        Мы отправили инструкцию по восстановлению пароля на указанный email.<br>
                        Если письмо не пришло через несколько минут, проверьте папку <strong style="color: var(--navy-800);">"Спам"</strong>.
                    </p>

                    <a href="{% url 'login' %}" class="btn w-100 py-2 text-white fw-bold" 
                       style="background-color: var(--navy-900); border-radius: 8px; border: none; transition: all 0.2s;">
                        <i class="fas fa-sign-in-alt me-2" style="color: var(--accent);"></i>Вернуться к входу
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
