{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm" style="border-radius: 16px; overflow: hidden;">
                
                <div class="py-4 text-center" style="background-color: var(--navy-900); border-bottom: 3px solid var(--accent);">
                    <i class="fas fa-key fa-3x mb-3" style="color: var(--accent);"></i>
                    <h4 class="text-white mb-1" style="font-family: var(--font-heading); font-weight: 700;">Восстановление пароля</h4>
                    <p class="mb-0 small" style="color: rgba(255,255,255,0.6);">Введите email для сброса пароля</p>
                </div>

                <div class="card-body p-4 p-lg-5" style="background-color: #ffffff;">
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-4">
                            <label for="id_email" class="form-label fw-bold text-muted small mb-2">
                                <i class="fas fa-envelope me-2" style="color: var(--navy-600);"></i>Email
                            </label>
                            <input type="email" name="email" id="id_email"
                                   class="form-control form-control-lg"
                                   placeholder="example@mail.ru"
                                   required autofocus
                                   style="border: 1px solid var(--border-strong); border-radius: 8px;">
                            <div class="form-text text-muted mt-2" style="font-size: 0.85rem;">
                                <i class="fas fa-info-circle me-1" style="color: var(--navy-600);"></i>
                                Введите действительный email. Не обязательно тот, с которым регистрировались, главное — чтобы вы имели к нему доступ.
                            </div>
                        </div>

                        <button type="submit" class="btn btn-lg w-100 mb-4 text-white" 
                                style="background-color: var(--navy-900); border-radius: 8px; font-weight: 600; border: none; transition: all 0.2s;">
                            <i class="fas fa-paper-plane me-2" style="color: var(--accent);"></i>Отправить инструкцию
                        </button>

                        <div class="text-center">
                            <a href="{% url 'login' %}" class="text-decoration-none fw-semibold" style="color: var(--navy-700);">
                                <i class="fas fa-arrow-left me-1"></i>Вернуться к входу
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
